<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="images/fav.png"><link rel="stylesheet" href="assets/css/portal.css"><style>.rm-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}.rm-tools input,.rm-tools select,.rm-field input,.rm-field select,.rm-field textarea{padding:10px 12px;border:1px solid #cbd7e5;border-radius:8px;min-height:42px;color:#17365f;width:100%}.rm-tools input{flex:1;min-width:190px}.rm-tools select{width:190px}.rm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.rm-field{display:grid;gap:6px}.rm-field label{font-size:11px;font-weight:800;text-transform:uppercase;color:#36516f}.rm-card{border:1px solid #dbe4ef;background:#fff;border-radius:11px;overflow:hidden;margin-bottom:16px}.rm-card-head{padding:17px 20px;border-bottom:1px solid #e7edf5}.rm-card-head h2{margin:0;color:#17365f;font-size:16px}.rm-card-body{padding:20px}.rm-stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 18px}.rm-stat div{background:#fff;border:1px solid #dae3ef;border-radius:10px;padding:15px}.rm-stat span{display:block;color:#708098;font-size:11px}.rm-stat strong{display:block;color:#17365f;font-size:23px;margin-top:5px}.rm-table{width:100%;border-collapse:collapse}.rm-table td,.rm-table th{padding:13px 15px;text-align:left;border-bottom:1px solid #e5ebf3;font-size:12px}.rm-table th{background:#f7f9fc;color:#62748b;font-size:10px;text-transform:uppercase}.rm-money{font-variant-numeric:tabular-nums;font-weight:800;color:#17365f}.rm-status{border-radius:20px;background:#e8f1fe;color:#18416e;padding:4px 9px;font-size:10px;text-transform:uppercase;font-weight:800}.rm-alert{border-left:3px solid #e96a12;padding:12px 14px;background:#fff7ef;border-radius:5px;color:#425a78;margin-bottom:15px}.rm-modal-back{position:fixed;inset:0;background:rgba(14,32,58,.68);display:grid;place-items:center;z-index:30000;padding:20px}.rm-modal{width:min(460px,100%);background:#fff;border-radius:14px;overflow:hidden}.rm-modal-header{background:#17365f;padding:18px}.rm-modal-header img{max-width:180px;max-height:48px;object-fit:contain}.rm-modal-body{padding:23px;color:#17365f}.rm-modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.rm-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}@media(max-width:850px){.rm-grid,.rm-stat{grid-template-columns:1fr 1fr}}@media(max-width:550px){.rm-grid,.rm-stat{grid-template-columns:1fr}.rm-tools select{width:100%}}</style><title>All Refunds | Testing Management</title></head><body data-page="refunds"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/management-portal-guard.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/security.js"></script><script src="assets/js/shell.js?v=20261026-refunds-list"></script><script>(()=>{'use strict';const $=s=>document.querySelector(s),esc=v=>window.TestingShell.esc(v),usd=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0)/100),cent=v=>{const s=String(v).trim();if(!/^(?:\d+|\.\d{1,2}|\d+\.\d{0,2})$/.test(s))return NaN;let [a,b='']=s.split('.');return Number(a||0)*100+Number(b.padEnd(2,'0'))},money=v=>(v/100).toFixed(2);async function call(action,body={}){try{return await window.TestingAuth.invoke('testing-refund-management',{action,...body})}catch(e){let msg=e?.message||'Request failed';try{if(e?.context?.json){const b=await e.context.json();msg=b.error||b.message||msg}}catch{}throw Error(msg)}}function notice(t,error=false){const p=$('#rmNotice');if(p){p.textContent=t;p.style.color=error?'#a22c22':'#355572'}}function modal(title,message,label='Confirm',danger=false){return new Promise(resolve=>{let old=document.activeElement,overlay=document.createElement('div');overlay.className='rm-modal-back';overlay.innerHTML='<section class="rm-modal" role="alertdialog" aria-modal="true" aria-labelledby="rmModalHeading"><div class="rm-modal-header"><img src="images/logo2.png" alt="Screenings4u"></div><div class="rm-modal-body"><h2 id="rmModalHeading">'+esc(title)+'</h2><p>'+esc(message)+'</p><div class="rm-modal-actions"><button type="button" class="tm-btn" data-no>Cancel</button><button type="button" class="tm-btn '+(danger?'danger':'primary')+'" data-yes>'+esc(label)+'</button></div></div></section>';document.body.appendChild(overlay);let no=overlay.querySelector('[data-no]'),yes=overlay.querySelector('[data-yes]');function close(v){document.removeEventListener('keydown',key,true);overlay.remove();old?.focus?.();resolve(v)}function key(e){if(e.key==='Escape'){e.preventDefault();close(false)}if(e.key==='Tab'){e.preventDefault();(document.activeElement===no?yes:no).focus()}}document.addEventListener('keydown',key,true);no.onclick=()=>close(false);yes.onclick=()=>close(true);no.focus()})}
let rows=[];
function draw(){let search=$('#rmFind').value.trim().toLowerCase(),status=$('#rmFilter').value;let shown=rows.filter(r=>(!status||r.status===status)&&(!search||[r.id,r.order_id,r.order_number,r.customer_email,r.reason].some(t=>String(t||'').toLowerCase().includes(search))));$('#rmTable').innerHTML=shown.length?shown.map(r=>'<tr><td><a href="refund.html?id='+encodeURIComponent(r.id)+'"><strong>'+esc(r.order_number||r.order_id||'Refund')+'</strong></a><small style="display:block;color:#687b94">'+esc(r.id.slice(0,8).toUpperCase())+'</small></td><td>'+esc(r.customer_email||'—')+'</td><td>'+esc(r.reason||'—')+'</td><td class="rm-money">'+usd(r.gross_cents)+'</td><td class="rm-money">'+usd(r.net_cents)+'</td><td><span class="rm-status">'+esc(r.status.replaceAll('_',' '))+'</span></td><td>'+esc(new Date(r.created_at).toLocaleDateString())+'</td><td><a class="tm-btn" href="refund.html?id='+encodeURIComponent(r.id)+'">Open refund</a></td></tr>').join(''):'<tr><td colspan="8" style="padding:24px;color:#7b8a9d">No refunds found.</td></tr>'}
async function init(){window.TestingShell.render(await window.TestingAuth.requireAuth());window.TestingSecurity.init();$('#tmPage').innerHTML='<div class="tm-page-head"><div><span class="tm-kicker">SCREENINGS4U TESTING / FINANCE</span><h1>All Refunds</h1><p>Review, edit and manage refunds independently from their original orders.</p></div><a class="tm-btn primary" href="refund-create.html">+ Create Refund</a></div><section class="rm-stat"><div><span>All refunds</span><strong id="statAll">—</strong></div><div><span>Awaiting approval</span><strong id="statPending">—</strong></div><div><span>Approved / processing</span><strong id="statApproved">—</strong></div><div><span>Refunded to customers</span><strong id="statTotal">—</strong></div></section><div class="rm-tools"><input id="rmFind" placeholder="Search order, customer, refund ID or reason"><select id="rmFilter"><option value="">All statuses</option><option value="pending_approval">Pending approval</option><option value="approved">Approved</option><option value="processing">Processing</option><option value="succeeded">Succeeded</option><option value="failed">Failed</option><option value="rejected">Rejected</option></select><button class="tm-btn" id="rmRefresh">Refresh</button></div><section class="rm-card"><div class="tm-table-wrap"><table class="rm-table"><thead><tr><th>Order / Refund</th><th>Customer</th><th>Reason</th><th>Gross</th><th>Net</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody id="rmTable"></tbody></table></div></section><p id="rmNotice" role="status"></p>';$('#rmFind').oninput=draw;$('#rmFilter').onchange=draw;$('#rmRefresh').onclick=load;await load()}
async function load(){try{const d=await call('list');rows=d.refunds||[];$('#statAll').textContent=rows.length;$('#statPending').textContent=rows.filter(x=>x.status==='pending_approval').length;$('#statApproved').textContent=rows.filter(x=>['approved','processing'].includes(x.status)).length;$('#statTotal').textContent=usd(rows.filter(x=>x.status==='succeeded').reduce((s,x)=>s+x.net_cents,0));draw();notice('Refund records loaded.')}catch(e){notice(e.message,true)}}
window.TestingPages=Object.freeze({init});})();</script><script>(async()=>{try{await window.TestingPages.init()}catch(e){document.body.textContent='Unable to load refunds: '+e.message}})();</script></body></html>
