<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="images/fav.png"><title>Connecting Testing Management | screenings4u</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;font-family:Arial,sans-serif;color:#17335f}.card{width:min(440px,calc(100% - 36px));background:#fff;border:1px solid #d9e3f0;border-radius:15px;padding:34px;text-align:center;box-shadow:0 18px 48px rgba(23,61,120,.1)}img{width:210px;max-width:75%;margin-bottom:22px}h1{font-size:22px;margin:0 0 8px;color:#24467f}p{font-size:12px;color:#667892;line-height:1.6}.spin{width:32px;height:32px;margin:20px auto 0;border:3px solid #dce4ee;border-top-color:#ff6b00;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.error{color:#b42318}</style></head><body><main class="card"><img src="images/logo.png" alt="screenings4u"><h1>Connecting Testing Management</h1><p id="message">Verifying your Enterprise portal handoff…</p><div class="spin" id="spin"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script>(async()=>{const m=document.getElementById('message'),s=document.getElementById('spin');try{const code=new URLSearchParams(location.search).get('code')||'';if(!code)throw new Error('Secure management portal handoff code is missing.');const c=window.testingSupabase,r=await c.functions.invoke('management-portal-handoff',{body:{action:'redeem',code}});if(r.error||r.data?.error||!r.data?.token_hash||!r.data?.portal_session_token)throw new Error(r.data?.error||r.error?.message||'Unable to redeem portal handoff.');const v=await c.auth.verifyOtp({token_hash:r.data.token_hash,type:'email'});if(v.error||!v.data?.session)throw v.error||new Error('Unable to establish Testing staff session.');sessionStorage.setItem('s4u-management-entry-testing-v1',r.data.portal_session_token);history.replaceState(null,'',location.pathname);const n=String(r.data.next_path||'/dashboard.html');location.replace(n.startsWith('/')&&!n.startsWith('//')?n:'/dashboard.html')}catch(e){s.hidden=true;m.className='error';m.textContent=e?.message||'Unable to open Testing Management.'}})();</script></body></html>
