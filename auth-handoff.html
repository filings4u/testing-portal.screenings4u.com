<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="images/fav.png"><link rel="stylesheet" href="assets/css/login.css"><title>Connecting Testing Management | Screenings4u</title><style>.handoff{min-height:100vh;display:grid;place-items:center;background:#f4f7fb;padding:20px}.handoff-card{width:min(460px,100%);background:#fff;border:1px solid #dce4ee;border-radius:15px;padding:34px;text-align:center;box-shadow:0 18px 48px rgba(23,61,120,.1)}.handoff-card img{width:230px;max-width:75%;margin-bottom:22px}.handoff-card h1{margin:0 0 8px;color:#24467f;font-size:23px}.handoff-card p{margin:0;color:#68778c;font-size:12px;line-height:1.6}.spin{width:32px;height:32px;margin:20px auto 0;border:3px solid #dce4ee;border-top-color:#ff6b00;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.error{color:#b42318!important}</style></head><body><main class="handoff"><section class="handoff-card"><img src="images/logo.png" alt="Screenings4u"><h1>Connecting Testing Management</h1><p id="message">Verifying your Enterprise portal handoff…</p><div id="spin" class="spin"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script>(async()=>{const m=document.getElementById('message'),spin=document.getElementById('spin');try{const code=new URLSearchParams(location.search).get('code')||'';if(!code)throw new Error('Secure management portal handoff code is missing.');const c=window.testingSupabase,r=await c.functions.invoke('management-portal-handoff',{body:{action:'redeem',code}});if(r.error||r.data?.error||!r.data?.token_hash||!r.data?.portal_session_token)throw new Error(r.data?.error||r.error?.message||'Unable to redeem portal handoff.');const v=await c.auth.verifyOtp({token_hash:r.data.token_hash,type:'email'});if(v.error||!v.data?.session)throw v.error||new Error('Unable to establish staff session.');sessionStorage.setItem('s4u-management-entry-testing-v1',r.data.portal_session_token);history.replaceState(null,'',location.pathname);const next=String(r.data.next_path||'/dashboard.html');location.replace(next.startsWith('/')&&!next.startsWith('//')?next:'/dashboard.html')}catch(e){spin.hidden=true;m.className='error';m.textContent=e?.message||'Unable to open Testing Management. Return to Enterprise and select Testing Management again.'}})();</script></body></html>
