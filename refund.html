<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="images/fav.png"><link rel="stylesheet" href="assets/css/portal.css"><style>.rm-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}.rm-tools input,.rm-tools select,.rm-field input,.rm-field select,.rm-field textarea{padding:10px 12px;border:1px solid #cbd7e5;border-radius:8px;min-height:42px;color:#17365f;width:100%}.rm-tools input{flex:1;min-width:190px}.rm-tools select{width:190px}.rm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.rm-field{display:grid;gap:6px}.rm-field label{font-size:11px;font-weight:800;text-transform:uppercase;color:#36516f}.rm-card{border:1px solid #dbe4ef;background:#fff;border-radius:11px;overflow:hidden;margin-bottom:16px}.rm-card-head{padding:17px 20px;border-bottom:1px solid #e7edf5}.rm-card-head h2{margin:0;color:#17365f;font-size:16px}.rm-card-body{padding:20px}.rm-stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 18px}.rm-stat div{background:#fff;border:1px solid #dae3ef;border-radius:10px;padding:15px}.rm-stat span{display:block;color:#708098;font-size:11px}.rm-stat strong{display:block;color:#17365f;font-size:23px;margin-top:5px}.rm-table{width:100%;border-collapse:collapse}.rm-table td,.rm-table th{padding:13px 15px;text-align:left;border-bottom:1px solid #e5ebf3;font-size:12px}.rm-table th{background:#f7f9fc;color:#62748b;font-size:10px;text-transform:uppercase}.rm-money{font-variant-numeric:tabular-nums;font-weight:800;color:#17365f}.rm-status{border-radius:20px;background:#e8f1fe;color:#18416e;padding:4px 9px;font-size:10px;text-transform:uppercase;font-weight:800}.rm-alert{border-left:3px solid #e96a12;padding:12px 14px;background:#fff7ef;border-radius:5px;color:#425a78;margin-bottom:15px}.rm-modal-back{position:fixed;inset:0;background:rgba(14,32,58,.68);display:grid;place-items:center;z-index:30000;padding:20px}.rm-modal{width:min(460px,100%);background:#fff;border-radius:14px;overflow:hidden}.rm-modal-header{background:#17365f;padding:18px}.rm-modal-header img{max-width:180px;max-height:48px;object-fit:contain}.rm-modal-body{padding:23px;color:#17365f}.rm-modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.rm-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}@media(max-width:850px){.rm-grid,.rm-stat{grid-template-columns:1fr 1fr}}@media(max-width:550px){.rm-grid,.rm-stat{grid-template-columns:1fr}.rm-tools select{width:100%}}</style><title>Refund Record | Testing Management</title></head><body data-page="refund"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/management-portal-guard.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/security.js"></script><script src="assets/js/shell.js?v=20261026-refunds-list"></script><script>(()=>{'use strict';
const $=s=>document.querySelector(s),esc=v=>window.TestingShell.esc(v),fmt=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(c||0)/100),toCents=v=>{const t=String(v).trim();if(!/^(?:\d+|\.\d{1,2}|\d+\.\d{0,2})$/.test(t))return NaN;const [a,b='']=t.split('.');return Number(a||0)*100+Number(b.padEnd(2,'0'))},num=c=>(c/100).toFixed(2);
async function api(action,x={}){try{return await window.TestingAuth.invoke('testing-refund-management',{action,...x})}catch(e){let msg=e.message;try{if(e.context?.json){const b=await e.context.json();msg=b.error||msg}}catch{}throw Error(msg)}}
function confirmBox(title,text,action){return new Promise(resolve=>{const m=document.createElement('div');m.className='rm-modal-back';m.innerHTML='<section class="rm-modal" role="alertdialog" aria-modal="true"><div class="rm-modal-header"><img src="images/logo2.png" alt="Screenings4u"></div><div class="rm-modal-body"><h2>'+esc(title)+'</h2><p>'+esc(text)+'</p><div class="rm-modal-actions"><button class="tm-btn" data-no>Cancel</button><button class="tm-btn primary" data-yes>'+esc(action)+'</button></div></div></section>';document.body.appendChild(m);const close=x=>{m.remove();resolve(x)};m.querySelector('[data-no]').onclick=()=>close(false);m.querySelector('[data-yes]').onclick=()=>close(true);m.querySelector('[data-no]').focus()})}
let record,order,dirty=false;function note(x,error=false){$('#msg').textContent=x;$('#msg').style.color=error?'#a53025':'#315477'}
function render(){const editable=['pending_approval','approved'].includes(record.status),canProcess=record.status==='approved';const moneyField=(label,id,value)=>'<div class="rm-field"><label for="'+id+'">'+esc(label)+'</label><input id="'+id+'" type="text" inputmode="decimal" value="'+num(value)+'" '+(editable?'':'disabled')+'></div>';$('#tmPage').innerHTML='<div class="tm-page-head"><div><span class="tm-kicker">SCREENINGS4U TESTING / FINANCE</span><h1>Refund Record</h1><p>'+esc(record.id)+' · <span class="rm-status">'+esc(record.status.replaceAll('_',' '))+'</span></p></div><div class="tm-actions"><a class="tm-btn" href="refunds.html">All Refunds</a><a class="tm-btn" href="refund-create.html?id='+encodeURIComponent(record.order_id)+'">New Refund</a></div></div><div class="rm-grid" style="grid-template-columns:minmax(0,1.3fr) minmax(290px,.7fr)"><div><section class="rm-card"><div class="rm-card-head"><h2>Refund Details</h2></div><div class="rm-card-body"><div class="rm-alert">'+(editable?'Edit the refund amounts and notes before execution. Saving changes resets approval so you can review the revised refund.':'This refund cannot be edited after processing begins. Its financial history is preserved.')+'</div><div class="rm-grid">'+moneyField('Gross refund ($)','gross',record.gross_cents)+moneyField('Restocking / cancellation fee ($)','restock',record.restocking_fee_cents)+moneyField('Re-service / provider fee ($)','reservice',record.reservice_fee_cents)+moneyField('Other approved fee ($)','other',record.other_fee_cents)+'<div class="rm-field"><label>Reason</label><select id="reason" '+(editable?'':'disabled')+'>'+['customer_request','duplicate_order','service_unavailable','customer_cancelled','provider_cancelled','no_show','service_issue','billing_error','courtesy','other'].map(x=>'<option value="'+x+'" '+(x===record.reason?'selected':'')+'>'+x.replaceAll('_',' ')+'</option>').join('')+'</select></div><div class="rm-field"><label>Fee explanation</label><input id="explanation" value="'+esc(record.fee_explanation||'')+'" '+(editable?'':'disabled')+'></div><div class="rm-field" style="grid-column:1/-1"><label>Internal justification</label><textarea rows="4" id="notes" '+(editable?'':'disabled')+'>'+esc(record.notes||'')+'</textarea></div></div><div id="rmDraft" class="rm-alert" role="status"></div><div class="rm-actions">'+(editable?'<button class="tm-btn primary" id="save">Save Changes</button>':'')+(record.status==='pending_approval'?'<button class="tm-btn" id="approve">Approve</button><button class="tm-btn danger" id="reject">Reject</button>':'')+(canProcess?'<button class="tm-btn primary" id="execute">Execute Stripe Refund</button>':'')+(record.status==='processing'?'<button class="tm-btn" id="reconcile">Reconcile with Stripe</button>':'')+(record.status==='succeeded'?'<button class="tm-btn primary" id="sendEmail">Send Refund Email</button>':'')+'</div><p id="msg" role="status" style="margin-top:14px"></p></div></section></div><aside><section class="rm-card"><div class="rm-card-head"><h2>Financial Summary</h2></div><div class="rm-card-body"><p>Order: <a href="order.html?id='+encodeURIComponent(record.order_id)+'">'+esc(order?.order_number||record.order_id)+'</a></p><p>Customer: '+esc(order?.customer_email||'—')+'</p><p>Original order: '+new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(order?.total||0))+'</p><hr><p>Gross: <strong>'+fmt(record.gross_cents)+'</strong></p><p>Total deductions: <strong>'+fmt(record.restocking_fee_cents+record.reservice_fee_cents+record.other_fee_cents)+'</strong></p><p style="font-size:19px">Customer refund: <strong>'+fmt(record.net_cents)+'</strong></p><hr><p>Stripe refund: '+esc(record.gateway_refund_id||'Not issued')+'</p><p>Created: '+esc(new Date(record.created_at).toLocaleString())+'</p><p>Reviewed: '+esc(record.reviewed_at?new Date(record.reviewed_at).toLocaleString():'Not yet')+'</p><p>Processed: '+esc(record.processed_at?new Date(record.processed_at).toLocaleString():'Not yet')+'</p></div></section></aside></div>';if(editable){$('#save').onclick=save;['gross','restock','reservice','other','reason','explanation','notes'].forEach(k=>$('#'+k).addEventListener('input',preview));}preview();if($('#approve'))$('#approve').onclick=()=>act('approve','Approve refund request?','Approve');if($('#reject'))$('#reject').onclick=()=>act('reject','Reject this refund request?','Reject');if($('#execute'))$('#execute').onclick=()=>act('execute','This issues a real Stripe refund to the original payment method.','Execute Refund');if($('#reconcile'))$('#reconcile').onclick=()=>act('reconcile','Check Stripe for the latest refund status?','Reconcile');if($('#sendEmail'))$('#sendEmail').onclick=()=>act('send_confirmation','Send the refund confirmation to the customer email on the order?','Send Email')}
function preview(){const fields=['gross','restock','reservice','other'];const values=fields.map(k=>toCents($('#'+k).value));const [gross,restock,reservice,other]=values;const valid=values.every(n=>Number.isSafeInteger(n)&&n>=0)&&gross>restock+reservice+other;dirty=fields.some((k,i)=>values[i]!==record[['gross_cents','restocking_fee_cents','reservice_fee_cents','other_fee_cents'][i]])||$('#reason').value!==record.reason||$('#notes').value!==record.notes||$('#explanation').value!==(record.fee_explanation||'');const banner=$('#rmDraft');if(banner){banner.textContent=dirty?(valid?'Unsaved changes — proposed customer refund: '+fmt(gross-restock-reservice-other):'Invalid unsaved amounts'):'Saved refund amount: '+fmt(record.net_cents);banner.style.color=dirty?'#a43d22':'#315477'}if($('#execute'))$('#execute').disabled=dirty;if($('#approve'))$('#approve').disabled=dirty;if($('#save'))$('#save').disabled=!dirty;}
async function save(){const values=['gross','restock','reservice','other'].map(k=>toCents($('#'+k).value));const [gross,restock,reservice,other]=values;if(values.some(n=>!Number.isSafeInteger(n)||n<0)||gross<=0||gross<=restock+reservice+other){note('Enter valid dollars and cents. Fees must total less than the gross refund.',true);return}const notes=$('#notes').value.trim();if(notes.length<15){note('Enter at least 15 characters of justification.',true);return}if(!(await confirmBox('Save refund changes','Saving will reset the request to pending approval. No money will be moved.','Save Changes')))return;try{const result=await api('update_request',{request_id:record.id,order_id:record.order_id,gross_cents:gross,restocking_fee_cents:restock,reservice_fee_cents:reservice,other_fee_cents:other,reason:$('#reason').value,notes,fee_explanation:$('#explanation').value,line_items:record.line_items||[]});record=result.request;dirty=false;render();note('Changes saved. Review the new amount and approve before processing.')}catch(e){note(e.message,true)}}
async function act(action,message,label){if(dirty){note('Save changes before approving or executing the refund.',true);return}if(!(await confirmBox(label,message,label)))return;try{const result=await api(action,{request_id:record.id});record=result.request||record;render();note(result.warning||({approve:'Refund approved. No money has moved.',reject:'Refund request rejected.',execute:'Stripe refund status: '+(result.gateway_status||record.status),reconcile:'Reconciliation status: '+(result.gateway_status||record.status),send_confirmation:'Refund email status: '+(result.status||'unknown')}[action]));}catch(e){note(e.message,true)}}
async function init(){const id=new URLSearchParams(location.search).get('id');if(!id){location.href='refunds.html';return}const auth=await window.TestingAuth.requireAuth();if(!auth)return;window.TestingShell.render(auth);window.TestingSecurity.init();const all=await api('list');record=(all.refunds||[]).find(r=>r.id===id);if(!record)throw Error('Refund record not found');try{const d=await window.TestingAuth.invoke(window.TESTING_PORTAL_CONFIG.orderFunction,{action:'get',order_id:record.order_id});order=d.order}catch{}render()}
window.TestingPages=Object.freeze({init});})();</script><script>(async()=>{try{await window.TestingPages.init()}catch(e){document.body.innerHTML='<main class="tm-page"><div class="tm-banner error">'+String(e.message)+'</div><a href="refunds.html">Back to refunds</a></main>'}})()</script></body></html>
